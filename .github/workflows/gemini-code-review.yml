name: Gemini Code Review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Run Gemini Code Review
        uses: petarzarkov/gemini-code-review-action@v1.1.3
        with:
          model: gemini-3.5-flash-lite
          enable_conversation_context: true
          skip_draft_prs: true
          language: Korean
          exclude: "*.md,**/*.md,*.json,**/*.json,*.yml,**/*.yml,*.yaml,**/*.yaml,*.lock,**/*.lock,pnpm-lock.yaml,package-lock.json,yarn.lock,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.stories.ts,**/*.stories.tsx,**/__tests__/**,test/**,tests/**,dist/**,build/**,.output/**,storybook-static/**"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add LGTM when no review findings
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          marker='표시할 리뷰가 없습니다 LGTM~~'

          if gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[].body' | grep -Fq "$marker"; then
            exit 0
          fi

          bot_reviews=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            --jq '[.[] | select(.user.login == "github-actions[bot]")] | length')
          bot_comments=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]")] | length')

          if [ "$bot_reviews" -eq 0 ] && [ "$bot_comments" -eq 0 ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "$marker"
          fi
